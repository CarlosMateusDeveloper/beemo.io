spring:
  config:
    import: 'optional:file:./.env[extension=.properties][encoding=utf-8]'
  application:
    name: clinica

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinica}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 5m
      cookie:
        http-only: true
        same-site: lax
        secure: ${AUTH_SECURE_COOKIES:false}

logging:
  structured:
    format:
      console: logstash
  level:
    org.hibernate.SQL: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'

management:
  # Coleta interna. Não publica métricas globais entre tenants via HTTP.
  endpoints:
    web:
      exposure:
        exclude: '*'
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  time-zone: ${APP_TIME_ZONE:America/Fortaleza}
  clinical-encryption:
    key-version: ${DATA_ENCRYPTION_KEY_VERSION:v1}
    key: ${DATA_ENCRYPTION_KEY:}
    previous-keys: ${DATA_ENCRYPTION_PREVIOUS_KEYS:}
    allow-legacy-read: ${DATA_ENCRYPTION_ALLOW_LEGACY_READ:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Sem configuração, gera chave aleatória em memória: reiniciar encerra sessões.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  auth:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:}
  import-file:
    encryption-key: ${IMPORT_FILE_ENCRYPTION_KEY:}
  export:
    # Base64 de 32 bytes. Obrigatória para gerar ou abrir exportações.
    encryption-key: ${EXPORT_ENCRYPTION_KEY:}
  data-encryption:
    key: ${DATA_ENCRYPTION_KEY:}
    keys: ${DATA_ENCRYPTION_KEYS:}
    active-version: ${DATA_ENCRYPTION_LEGACY_ACTIVE_VERSION:1}
