spring:
  application:
    name: clinica

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinica}
    username: ${DB_USER:clinica}
    password: ${DB_PASSWORD:clinica}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Default só serve pra dev local (mesmo padrão do DB_PASSWORD acima) —
    # em produção isso precisa vir de uma env var real, nunca do default.
    secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-3f8a9c1e5b7d2f4a6c8e0b1d3f5a7c9e}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
