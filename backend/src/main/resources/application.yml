spring:
  application:
    name: clinica

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinica}
    username: ${DB_USER:clinica}
    password: ${DB_PASSWORD:clinica}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 5m
      cookie:
        http-only: true
        same-site: lax
        secure: ${AUTH_SECURE_COOKIES:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Sem configuração, gera chave aleatória em memória: reiniciar encerra sessões.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  auth:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:}
