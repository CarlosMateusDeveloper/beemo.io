name: clinisis

services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - application
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      SERVER_PORT: "8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/auth/providers > /dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  agenda:
    build:
      context: ./agenda-service
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      AUTH_API_URL: http://api:8080
      CORS_ALLOWED_ORIGIN: ${APP_FRONTEND_URL}
      DB_SSLMODE: disable
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - application
    read_only: true
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: ${CHATBOT_DATABASE_URL:?Defina_CHATBOT_DATABASE_URL_no_env_production}
      AUTH_API_URL: http://api:8080
      CORS_ALLOWED_ORIGINS: ${APP_FRONTEND_URL}
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  edge:
  application:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
